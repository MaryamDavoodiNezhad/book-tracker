<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booktrack</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header id="header">
      <h1 class="title-header">Book tracker</h1>
    </header>

    <main class="container">
      <!-- section controls -->
      <section class="container-controls">
        <button id="show-books">Show Books</button>
        <button id="add-book">Add Book</button>
        <button id="search-book">Search by book title</button>
        <input id="title-search-book" />
      </section>

      <div id="books-container" class="pic-cover"></div>
      <template id="container-cards-books">
        <article class="Book-card">
          <div class="book-info">
            <img src="" class="book-cover" />
            <div class="info-content">
              <div class="info-title">
                
                <label>Name book : </label>
                <h3 class="book-title"></h3>
              </div>

              <div class="info-type">
                
                <label>Type book : </label>
                <h3 class="book-type"></h3>
              </div>

              <div class="info-author">
                
                <label>Name author :</label>
                <p class="book-author"></p>
              </div>
            </div>
          </div>

          <div class="book-status">
            <label>
              <input type="radio" name="status" value="reading" />
              Reading
            </label>

            <label>
              <input type="radio" name="status" value="read" />
              Read
            </label>

            <label>
              <input type="radio" name="status" value="Un read" />
              UnRead Book
            </label>
            <div class="removeBook">
              <button id="delete">Remove</button>
            </div>
          </div>
        </article>
      </template>
    </main>
    <script type="module" src="scripts/storage.js"></script>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
